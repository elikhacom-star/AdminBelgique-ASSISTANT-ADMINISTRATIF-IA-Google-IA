<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Belgian tricolor bar at top -->
  <g transform="translate(196, 60)">
    <rect x="0" y="0" width="40" height="18" rx="4" fill="#000000"/>
    <rect x="40" y="0" width="40" height="18" fill="#facc15"/>
    <rect x="80" y="0" width="40" height="18" rx="4" fill="#ef4444"/>
  </g>

  <!-- Central Emblem / Administrative Shield -->
  <g transform="translate(136, 120)">
    <rect x="20" y="30" width="200" height="230" rx="36" fill="url(#accent)" opacity="0.15" stroke="#3b82f6" stroke-width="8"/>
    <!-- Building columns -->
    <path d="M 60 110 L 180 110" stroke="#60a5fa" stroke-width="12" stroke-linecap="round"/>
    <path d="M 120 70 L 60 110 L 180 110 Z" fill="#60a5fa"/>
    <rect x="75" y="125" width="16" height="80" rx="4" fill="#93c5fd"/>
    <rect x="112" y="125" width="16" height="80" rx="4" fill="#93c5fd"/>
    <rect x="149" y="125" width="16" height="80" rx="4" fill="#93c5fd"/>
    <rect x="55" y="215" width="130" height="16" rx="4" fill="#60a5fa"/>
  </g>

  <!-- Typography / Badge bottom -->
  <text x="256" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">ADMIN<tspan fill="#60a5fa">BE</tspan></text>
</svg>
